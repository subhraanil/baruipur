name: Build and Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Restore Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/data/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js 14 Static Export
        run: npm run build
        env:
          NEXT_BUILD_ID: 'baruipur-static-v1'

      - name: Deploy to cPanel via Differential FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 162.214.80.55
          username: twofouti
          password: ${{ secrets.CPANEL_PASSWORD }}
          server-dir: public_html/baruipur/
          local-dir: out/
          state-name: .ftp-deploy-sync-state-v2.json
          log-level: standard
          dangerous-clean-slate: false
