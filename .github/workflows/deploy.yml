name: Build and Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js 14 Application
        run: npm run build

      - name: Prepare Standalone Bundle for cPanel Passenger
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          echo "require('./server.js');" > .next/standalone/app.js
          mkdir -p .next/standalone/tmp
          touch .next/standalone/tmp/restart.txt

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 162.214.80.55
          username: twofouti
          password: ${{ secrets.CPANEL_PASSWORD }}
          server-dir: public_html/baruipur/
          local-dir: .next/standalone/
