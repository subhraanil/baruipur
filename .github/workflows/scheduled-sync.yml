name: Civic Directory, Notices & Tenders Scheduled Sync

on:
  schedule:
    # 03:30 UTC = 9:00 AM IST, 13:30 UTC = 7:00 PM IST
    - cron: '30 3,13 * * *'
  workflow_dispatch:

jobs:
  sync-civic-portal:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Python Dependencies
        run: pip install requests

      - name: Sync & Validate 5 Civic Pillars (Places, Orgs, Health, Notices, Tenders)
        run: node scripts/sync-civic-portal.js

      - name: Regenerate Clean Sitemaps, Feeds & SEO Discovery Assets
        run: node scripts/generate-seo-assets.js

      - name: Validate Production Build Readiness
        run: npm run build

      - name: Broadcast Updates to IndexNow (Bing & Search Engines)
        run: python scripts/submit_indexnow.py || true

      - name: Commit and Push Changes (if any directory or tender updates)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/ public/ scripts/
          if git diff --staged --quiet; then
            echo "No changes or updates detected in civic directory."
          else
            git commit -m "chore(sync): auto-sync civic directory, public tenders and official notices"
            git push origin main
          fi
