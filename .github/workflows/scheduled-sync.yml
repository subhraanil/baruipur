name: Twice Daily News Sync (AdSense Compliant)

on:
  schedule:
    # 03:30 UTC = 9:00 AM IST, 13:30 UTC = 7:00 PM IST
    - cron: '30 3,13 * * *'
  workflow_dispatch:

jobs:
  sync-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Python Dependencies
        run: pip install requests

      - name: Run News Sync with AdSense Quality Standards
        run: node scripts/sync-news.js --days=1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate Clean Sitemaps, Feeds & SEO Assets
        run: node scripts/generate-seo-assets.js

      - name: AdSense Quality Gate Validation
        run: |
          python -c "
          import json, sys
          with open('src/data/news_data.json', encoding='utf-8') as f:
              data = json.load(f)
          pub = [a for a in data.get('articles', []) if a.get('status') == 'published']
          thin = [a for a in pub if len(a.get('content', '').split()) < 200]
          if thin:
              print(f'❌ AdSense Quality Violation: Found {len(thin)} thin articles with < 200 words.')
              sys.exit(1)
          print(f'✅ AdSense Quality Check Passed: All {len(pub)} published articles have >= 200 words.')
          "

      - name: Broadcast Updates to IndexNow (Bing & Search Engines)
        run: python scripts/submit_indexnow.py || true

      - name: Commit and Push Changes (if any new posts)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/news_data.json public/ scripts/
          if git diff --staged --quiet; then
            echo "No changes or new articles found today."
          else
            git commit -m "Auto-sync daily news adhering to AdSense quality standards"
            git push origin main
          fi
